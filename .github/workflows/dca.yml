name: DCA Monthly Report

on:
  schedule:
    - cron: '0 1 1 * *'   # 每月1号 UTC 01:00 = 北京时间 09:00
  workflow_dispatch:        # 允许你手动点按钮测试

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Run DCA script
        run: |
          python dca_auto.py > output.txt 2>&1
          cat output.txt

      - name: Send to WeChat via PushPlus
        run: |
          python -c "
          import requests, json
          with open('output.txt', 'r') as f:
              content = f.read()
          data = {
              'token': '${{ secrets.PUSHPLUS_TOKEN }}',
              'title': '📊 DCA定投月报',
              'content': '<pre>' + content + '</pre>',
              'template': 'html'
          }
          r = requests.post('https://www.pushplus.plus/send', json=data)
          print('PushPlus response:', r.json())
          "

      - name: Save data file back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dca_auto_data.json
          git diff --cached --quiet || git commit -m "📅 auto-update data"
          git push
